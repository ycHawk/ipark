        function isWithinRadius(lat1, lon1, lat2, lon2, radiusInMeters) {
            const R = 6371e3; // Earth's radius in meters
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const distance = R * c; // Distance in meters

            return distance <= radiusInMeters;
        }

            //statusDiv.innerText = `Sparat! Lat: ${coords.lat.toFixed(4)}, Lng: ${coords.lng.toFixed(4)}`;
        }, (error) => {

        // KNAPP 1: Spara position 
        saveBtn.addEventListener('click', async () => {
            if (!navigator.geolocation) {
                statusDiv.innerText = "Tyvärr stödjer inte din webbläsare GPS.";

            }

            //for (let index = 0; index < 10; index++) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const coords = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };
                console.log(new Date().toISOString(), position.coords.accuracy);
                // const coords = {
                //     lat: 59.339342,

                // };

                localStorage.setItem('savedLocation', JSON.stringify(coords));

        // KNAPP 2: Visa sparad position på karta 
        showBtn.addEventListener('click', () => {
            //const savedData = localStorage.getItem('savedLocation');
            if (!existingCoordinates) {
                statusDiv.innerText = "Det finns ingen sparad plats att visa!";
                return;
            }
            const homeCoords = existingCoordinates.home;
            const carCoords = existingCoordinates.car;
            statusDiv.innerText = `Visar sparad plats: ${carCoords.lat.toFixed(4)}, ${carCoords.lng.toFixed(4)}`;
            // Gör kartan synlig 
            mapDiv.style.display = "block";

            // Skapa eller uppdatera kartan 
            if (map === null) {
                // Starta kartan och zooma in på koordinaterna 
                map = L.map('map').setView([carCoords.lat, carCoords.lng], 15);


                // Ladda in kartbilder från OpenStreetMap 
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
                // Sätt ut en nål (marker) 
                marker = L.marker([homeCoords.lat, homeCoords.lng]).addTo(map);
                L.circle([homeCoords.lat, homeCoords.lng], { radius: 12 }).addTo(map);

                marker = L.marker([carCoords.lat, carCoords.lng]).addTo(map);
                L.circle([carCoords.lat, carCoords.lng], { radius: 20, color: 'red' }).addTo(map);
            } else {
                // Om kartan redan finns, flytta den bara till den nya platsen 
                map.setView([carCoords.lat, carCoords.lng], 15);
                marker.setLatLng([carCoords.lat, carCoords.lng]);
            }
            // Fixar en bugg i Leaflet där kartan ibland inte ritas ut rätt när den varit dold 
            setTimeout(() => { map.invalidateSize(); }, 200);
        });
