<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPark</title> <!-- PWA Inställningar för iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Min Plats"> <!-- Leaflet Karta CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f2f2f7;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 24px;
            color: #1c1c1e;
            margin-bottom: 20px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 300px;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s;
        }

        button:active {
            background-color: #0056b3;
        }

        #status {
            font-size: 14px;
            color: #8e8e93;
            text-align: center;
            margin-bottom: 10px;
        }

        #map {
            width: 100%;
            max-width: 400px;
            height: 300px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: none;
            /* Dold tills man klickar på visa-knappen */
        }
    </style>
</head>

<body>
    <h1>iPark</h1>
    <div class="button-container"> <button id="saveBtn"> Spara min nuvarande position</button> <button id="showBtn">
            Visa sparad position på karta</button> </div>
    <div id="status">Ingen plats sparad ännu.</div>
    <div id="map"></div> <!-- Leaflet Karta JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>

        const saveBtn = document.getElementById('saveBtn');
        const showBtn = document.getElementById('showBtn');
        const statusDiv = document.getElementById('status');
        const mapDiv = document.getElementById('map');
        let map = null; 
        let marker = null;
        let coordinates = [];
        // KNAPP 1: Spara position 
        saveBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                statusDiv.innerText = "Tyvärr stödjer inte din webbläsare GPS.";
                return;
            }
            statusDiv.innerText = "Hämtar position...";

            //for (let index = 0; index < 10; index++) {
            navigator.geolocation.getCurrentPosition((position) => {
                const coords = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };
                //coordinates.push(coords);
                //console.log(new Date().toLocaleTimeString(), coords);
                localStorage.setItem('savedLocation', JSON.stringify(coords));
                statusDiv.innerText = `Sparat! Lat: ${coords.lat.toFixed(4)}, Lng: ${coords.lng.toFixed(4)}`;
            }, (error) => {
                statusDiv.innerText = "Kunde inte hämta plats. Godkände du GPS-tillgång?";
                console.error(error);
            }, { enableHighAccuracy: true });
            //}
            // Math.avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
            // const avgCoords = {
            //     lat: Math.avg(coordinates.map(c => c.lat)),
            //     lng: Math.avg(coordinates.map(c => c.lng))
            // };
            // // Spara i telefonens minne som en textsträng 
            // console.log("Genomsnittliga koordinater:", avgCoords);
            // localStorage.setItem('savedLocation', JSON.stringify(avgCoords));
            // statusDiv.innerText = `Sparat! Lat: ${avgCoords.lat.toFixed(4)}, Lng: ${avgCoords.lng.toFixed(4)}`;
        });

        // KNAPP 2: Visa sparad position på karta 
        showBtn.addEventListener('click', () => {
            const savedData = localStorage.getItem('savedLocation');
            if (!savedData) {
                statusDiv.innerText = "Det finns ingen sparad plats att visa!";
                return;
            }
            const coords = JSON.parse(savedData);
            statusDiv.innerText = `Visar sparad plats: ${coords.lat.toFixed(4)}, ${coords.lng.toFixed(4)}`;
            // Gör kartan synlig 
            mapDiv.style.display = "block";

            // Skapa eller uppdatera kartan 
            if (map === null) {
                // Starta kartan och zooma in på koordinaterna 
                map = L.map('map').setView([coords.lat, coords.lng], 15);
                // Ladda in kartbilder från OpenStreetMap 
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
                // Sätt ut en nål (marker) 
                marker = L.marker([coords.lat, coords.lng]).addTo(map);
            } else {
                // Om kartan redan finns, flytta den bara till den nya platsen 
                map.setView([coords.lat, coords.lng], 15);
                marker.setLatLng([coords.lat, coords.lng]);
            }
            // Fixar en bugg i Leaflet där kartan ibland inte ritas ut rätt när den varit dold 
            setTimeout(() => { map.invalidateSize(); }, 200);
        }); 
    </script>
</body>

</html>
